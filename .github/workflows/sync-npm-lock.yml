name: Sync npm lock

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/sync-npm-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/sync-npm-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/sync-npm-lock.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes.'
            exit 0
          fi
          git commit -m 'fix: sync npm lockfile with patched react router'
          git push origin main
