name: One-time Content Queue Cleanup

on:
  push:
    branches:
      - maintenance/clean-content-queue

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean published and duplicate queue entries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const mapPath = path.join(root, 'src/data/content-map.json');
          const batchPath = path.join(root, 'src/data/seo-content-batch-01.json');
          const primaryPath = path.join(root, 'src/data/articles.json');
          const supportingPath = path.join(root, 'src/data/seo-supporting-articles.json');

          const map = JSON.parse(fs.readFileSync(mapPath, 'utf8'));
          const primary = JSON.parse(fs.readFileSync(primaryPath, 'utf8'));
          const supporting = JSON.parse(fs.readFileSync(supportingPath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));

          const primarySlugs = new Set(primary.map(a => a.slug));
          const supportingSlugs = new Set(supporting.map(a => a.slug));
          const publishedSlugs = new Set([...primarySlugs, ...supportingSlugs]);

          // Remove only batch records whose slug already exists in a canonical source.
          // Keep genuinely new batch articles because they are the live source for them.
          const cleanedBatch = batch.filter(a => !publishedSlugs.has(a.slug));
          const removedBatch = batch.filter(a => publishedSlugs.has(a.slug)).map(a => a.slug);

          // The batch's remaining records are also published and therefore should leave the queue.
          const batchSlugs = new Set(cleanedBatch.map(a => a.slug));
          for (const slug of batchSlugs) publishedSlugs.add(slug);

          const beforeQueue = Array.isArray(map.queue) ? map.queue : [];
          const cleanedQueue = beforeQueue.filter(item => !publishedSlugs.has(item.slug));
          const removedQueue = beforeQueue.filter(item => publishedSlugs.has(item.slug)).map(item => item.slug);

          map.updatedAt = new Date().toISOString().slice(0, 10);
          map.queue = cleanedQueue;

          fs.writeFileSync(mapPath, JSON.stringify(map, null, 2) + '\n');
          fs.writeFileSync(batchPath, JSON.stringify(cleanedBatch, null, 2) + '\n');

          console.log('Removed from batch:', removedBatch);
          console.log('Removed from queue:', removedQueue);
          console.log('Remaining queue:', cleanedQueue.length);
          console.log('Remaining batch records:', cleanedBatch.length);
          NODE

      - name: Verify JSON and no published slugs remain in queue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const map = JSON.parse(fs.readFileSync('src/data/content-map.json', 'utf8'));
          const primary = JSON.parse(fs.readFileSync('src/data/articles.json', 'utf8'));
          const supporting = JSON.parse(fs.readFileSync('src/data/seo-supporting-articles.json', 'utf8'));
          const batch = JSON.parse(fs.readFileSync('src/data/seo-content-batch-01.json', 'utf8'));
          const published = new Set([...primary, ...supporting, ...batch].map(a => a.slug));
          const duplicates = map.queue.filter((item, i, list) => list.findIndex(x => x.slug === item.slug) !== i);
          const stale = map.queue.filter(item => published.has(item.slug));
          if (duplicates.length || stale.length) {
            console.error({ duplicates: duplicates.map(x => x.slug), stale: stale.map(x => x.slug) });
            process.exit(1);
          }
          console.log(`Queue clean: ${map.queue.length} unique unpublished topics; batch: ${batch.length} unique records.`);
          NODE

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-content-queue-once.yml
          git add src/data/content-map.json src/data/seo-content-batch-01.json
          git diff --cached --check
          git commit -m "chore: clean published entries from content queue"
          git push
