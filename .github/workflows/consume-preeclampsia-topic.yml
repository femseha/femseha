name: Consume Preeclampsia Queue Topic
on:
  push:
    branches:
      - maintenance/next-content-preeclampsia
permissions:
  contents: write
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update queue and remove workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/data/content-map.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          const target = 'preeclampsia-warning-signs';
          const q = Array.isArray(m.queue) ? m.queue : [];
          const before = q.length;
          const next = q.filter(x => x.slug !== target);
          if (next.length === before) throw new Error(`Queue topic not found: ${target}`);
          if (next.some(x => x.slug === target)) throw new Error(`Queue topic remains duplicated: ${target}`);
          m.updatedAt = '2026-09-04';
          m.queue = next;
          fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          console.log(`Consumed ${target}: ${before} -> ${next.length}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consume-preeclampsia-topic.yml
          git add src/data/content-map.json
          git diff --cached --check
          git commit -m "chore: mark preeclampsia topic published"
          git push
