name: Sitemap Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/sitemap.xml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- public/sitemap.xml; then
            echo 'Sitemap is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add public/sitemap.xml
          git commit -m 'chore: sync sitemap with published articles'
          git push origin main
