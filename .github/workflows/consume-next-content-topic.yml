name: Consume Next Content Topic

on:
  push:
    branches:
      - maintenance/next-content-severe-period-pain

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove published topic from queue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const mapPath = 'src/data/content-map.json';
          const map = JSON.parse(fs.readFileSync(mapPath, 'utf8'));
          const target = 'severe-period-pain-causes';
          const queue = Array.isArray(map.queue) ? map.queue : [];
          const before = queue.length;
          const cleaned = queue.filter(item => item.slug !== target);
          if (cleaned.length === before) throw new Error(`Queue topic not found: ${target}`);
          if (cleaned.filter(item => item.slug === target).length) throw new Error(`Duplicate queue topic remains: ${target}`);
          map.updatedAt = '2026-09-04';
          map.queue = cleaned;
          fs.writeFileSync(mapPath, JSON.stringify(map, null, 2) + '\n');
          console.log(`Consumed ${target}; queue size ${before} -> ${cleaned.length}.`);
          NODE

      - name: Validate queue JSON
        run: |
          node <<'NODE'
          const fs = require('fs');
          const map = JSON.parse(fs.readFileSync('src/data/content-map.json', 'utf8'));
          const queue = map.queue || [];
          const dupes = queue.filter((item, i) => queue.findIndex(x => x.slug === item.slug) !== i);
          if (dupes.length) throw new Error(`Duplicate queue slugs: ${dupes.map(x => x.slug).join(', ')}`);
          console.log(`Queue valid: ${queue.length} unique topics remain.`);
          NODE

      - name: Commit queue update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consume-next-content-topic.yml
          git add src/data/content-map.json
          git diff --cached --check
          git commit -m "chore: mark severe period pain topic published"
          git push
