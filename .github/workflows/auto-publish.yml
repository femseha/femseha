name: Auto Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @google/genai
      - run: node scripts/generate-article.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Push changes
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add src/data/articles.ts
          git commit -m "Auto publish article" || exit 0
          git push
