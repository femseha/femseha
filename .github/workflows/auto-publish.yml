name: Auto Publish 3 Articles Daily

on:
  schedule:
    # يعمل 3 مرات يومياً (الساعة 9:00 صباحاً، 3:00 عصراً، 9:00 مساءً بتوقيت السعودية والأردن)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: # يتيح زر تشغيل يدوي للتجربة في أي وقت

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate & Publish Medical Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Femseha AutoBot"
          git config --global user.email "bot@femseha.com"
          git add src/data/articles.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Publish new medical article [skip ci]" && git push)
