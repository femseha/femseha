name: SEO and SSR verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Prerender metadata regression test
        run: npm run test:prerender-html
      - name: SEO data and sitemap validation
        run: npm run seo:validate
      - name: SSR route verification
        run: npm run seo:ssr
